<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grant Copilot</title>
<style>
:root{
  --green:#5FB54A; --green-d:#4a9439; --green-l:#eaf6e7;
  --orange:#EF6F1A; --orange-d:#c85a11; --orange-l:#fdeee3;
  --navy:#1F2A44; --navy-l:#2c3a5c; --navy-xl:#eef0f5;
  --ink:#1b2231; --mut:#6b7488; --line:#dfe3ec; --bg:#f5f6f9; --card:#fff;
  --red:#c0392b; --red-l:#fdecea; --amber:#b7791f; --amber-l:#fdf6e3;
  --r:10px; --sh:0 1px 3px rgba(31,42,68,.08), 0 1px 2px rgba(31,42,68,.06);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3,h4{margin:0 0 .5rem;line-height:1.25;color:var(--navy)}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.02rem}h4{font-size:.9rem}
p{margin:0 0 .7rem}
a{color:var(--green-d)}
small{color:var(--mut)}

/* header */
header{background:var(--navy);color:#fff;padding:0 18px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.hbar{display:flex;align-items:center;gap:14px;height:58px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.05rem;letter-spacing:.2px}
.logo .dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(95,181,74,.25)}
.logo .dot2{width:11px;height:11px;border-radius:50%;background:var(--orange);margin-left:-16px;box-shadow:0 0 0 3px rgba(239,111,26,.22)}
.hspace{flex:1}
.orgpick{display:flex;align-items:center;gap:7px}
.orgpick select{background:var(--navy-l);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:7px;padding:6px 9px;font:inherit;font-size:.86rem;max-width:230px}
nav{display:flex;gap:2px;overflow-x:auto;padding-bottom:0}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:rgba(255,255,255,.72);padding:11px 13px;font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--green);font-weight:600}
nav .badge{display:inline-block;background:var(--orange);color:#fff;border-radius:9px;font-size:.68rem;padding:1px 6px;margin-left:5px;font-weight:700;vertical-align:1px}

/* layout */
main{max-width:1180px;margin:0 auto;padding:20px 18px 70px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--sh)}
.card.pad0{padding:0;overflow:hidden}
.card>h2:first-child,.card>h3:first-child{margin-top:0}
.ch{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ch h2,.ch h3{margin:0}
.ch .hspace{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* forms */
label{display:block;font-size:.78rem;font-weight:600;color:var(--navy);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(95,181,74,.35);border-color:var(--green);outline-offset:-1px}
textarea{resize:vertical;min-height:72px;line-height:1.5}
.f{margin-bottom:12px}
.f .hint{font-size:.76rem;color:var(--mut);margin-top:3px;text-transform:none;letter-spacing:0;font-weight:400}
.inline{display:flex;gap:9px;align-items:center}
.inline input[type=checkbox]{width:auto}
.chk{display:flex;align-items:center;gap:7px;font-size:.9rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.chk input{width:16px;height:16px;flex:0 0 auto}

/* buttons */
button.b,a.b{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer;text-decoration:none}
button.b:hover{background:var(--green-d)}
button.b.o{background:var(--orange)}button.b.o:hover{background:var(--orange-d)}
button.b.n{background:var(--navy)}button.b.n:hover{background:var(--navy-l)}
button.b.g{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.b.g:hover{background:var(--navy-xl)}
button.b.sm{padding:5px 10px;font-size:.8rem}
button.b.dz{background:#fff;color:var(--red);border:1px solid #f0c5bf}
button.b.dz:hover{background:var(--red-l)}
button.b:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.lk{background:none;border:0;color:var(--green-d);font:inherit;font-size:.82rem;cursor:pointer;padding:2px 4px;text-decoration:underline}
button.lk.dz{color:var(--red)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:.89rem}
th{text-align:left;background:var(--navy-xl);color:var(--navy);font-size:.74rem;text-transform:uppercase;letter-spacing:.4px;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:#fafbfd}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}

/* bits */
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.73rem;font-weight:700;letter-spacing:.2px}
.pill.ok{background:var(--green-l);color:var(--green-d)}
.pill.warn{background:var(--amber-l);color:var(--amber)}
.pill.bad{background:var(--red-l);color:var(--red)}
.pill.neu{background:var(--navy-xl);color:var(--navy)}
.pill.org{background:var(--orange-l);color:var(--orange-d)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
.stat .n{font-size:1.75rem;font-weight:700;color:var(--navy);line-height:1.1}
.stat .l{font-size:.76rem;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.stat.a .n{color:var(--orange)}
.stat.d .n{color:var(--red)}
.meter{height:7px;background:var(--navy-xl);border-radius:999px;overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;background:var(--green);border-radius:999px}
.meter i.lo{background:var(--red)}.meter i.mid{background:var(--orange)}
.empty{text-align:center;padding:34px 18px;color:var(--mut)}
.empty .ic{font-size:1.9rem;opacity:.4;margin-bottom:6px}
.note{background:var(--navy-xl);border-left:3px solid var(--navy);padding:10px 13px;border-radius:0 7px 7px 0;font-size:.86rem;margin-bottom:14px}
.note.w{background:var(--amber-l);border-color:var(--amber)}
.note.d{background:var(--red-l);border-color:var(--red)}
.note.g{background:var(--green-l);border-color:var(--green)}
.gap{background:var(--red-l);border:1px dashed var(--red);color:var(--red);border-radius:5px;padding:1px 6px;font-weight:600;font-size:.84rem;font-family:ui-monospace,Menlo,Consolas,monospace}
.src{font-size:.74rem;color:var(--mut);font-style:italic}
.tag{display:inline-block;background:var(--navy-xl);color:var(--navy);border-radius:5px;font-size:.72rem;padding:2px 7px;margin:0 3px 3px 0}
.rowbox{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fcfcfe}
.rowbox .ch{margin-bottom:9px}
.sub{border-left:3px solid var(--green);padding-left:12px;margin:14px 0}
details{border:1px solid var(--line);border-radius:8px;margin-bottom:9px;background:#fff}
details>summary{padding:11px 13px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--navy);list-style:none;display:flex;gap:9px;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--green);font-size:.8rem}
details[open]>summary::before{content:"▾"}
details .dbody{padding:0 13px 13px;border-top:1px solid var(--line);padding-top:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:9px;font-size:.9rem;font-weight:500;z-index:200;opacity:0;transition:.25s;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--red)}
.wc{font-size:.76rem;color:var(--mut);text-align:right;margin-top:3px}
.wc.over{color:var(--red);font-weight:700}
.draftbox{font-size:.92rem;line-height:1.65;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px;min-height:90px}
.scorebar{display:flex;gap:3px;margin-top:6px}
.scorebar i{flex:1;height:5px;background:var(--navy-xl);border-radius:2px}
.scorebar i.f{background:var(--green)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.87rem}
.kv dt{color:var(--mut);white-space:nowrap}
.kv dd{margin:0;font-weight:500}
.modal{position:fixed;inset:0;background:rgba(31,42,68,.55);display:none;align-items:flex-start;justify-content:center;z-index:150;padding:24px 16px;overflow-y:auto}
.modal.on{display:flex}
.modal .inner{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
/* pipeline board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--navy-xl);border-radius:var(--r);padding:10px;min-height:180px;border:2px dashed transparent}
.col.over{border-color:var(--green);background:var(--green-l)}
.col h4{display:flex;align-items:center;gap:6px;margin:2px 2px 10px;font-size:.82rem;text-transform:uppercase;letter-spacing:.4px}
.col h4 .cnt{margin-left:auto;background:#fff;border-radius:9px;padding:0 7px;font-size:.72rem;color:var(--mut)}
.kc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;box-shadow:var(--sh);cursor:grab;font-size:.86rem}
.kc:active{cursor:grabbing}.kc.drag{opacity:.4}
.kc .t{font-weight:600;color:var(--navy);line-height:1.3;margin-bottom:3px}
.kc .m{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:6px}
.kc select{padding:3px 6px;font-size:.76rem;margin-top:7px}
.chk-list{list-style:none;padding:0;margin:0}
.chk-list li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.chk-list li .ic{flex:0 0 20px;font-weight:700;text-align:center}
.chk-list li.ok .ic{color:var(--green-d)}.chk-list li.warn .ic{color:var(--amber)}.chk-list li.block .ic{color:var(--red)}
.hbar-row{display:grid;grid-template-columns:minmax(110px,1.3fr) 3fr auto;gap:10px;align-items:center;padding:6px 0;font-size:.86rem;border-bottom:1px solid var(--line)}
.hbar-track{height:12px;background:transparent;position:relative}
.hbar-fill{height:12px;border-radius:0 4px 4px 0;background:var(--navy)}
.sync{font-size:.76rem;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:6px;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:#8a93a8;display:inline-block}
.sync.on i{background:var(--green)}.sync.busy i{background:var(--orange)}.sync.err i{background:#ff6b5b}
.ai-badge{display:inline-block;background:linear-gradient(90deg,#5FB54A,#3c8cc9);color:#fff;border-radius:5px;font-size:.68rem;font-weight:700;padding:1px 6px;letter-spacing:.3px;vertical-align:1px}
.opp{border:1px solid var(--line);border-radius:8px;padding:12px 13px;margin-bottom:10px;background:#fff}
.opp.new{border-left:4px solid var(--orange)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
.spin.dk{border-color:rgba(31,42,68,.2);border-top-color:var(--navy)}
@keyframes sp{to{transform:rotate(360deg)}}
.ver{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:9px;background:#fcfcfe}
.ver pre{white-space:pre-wrap;font:inherit;font-size:.86rem;margin:6px 0 0;max-height:180px;overflow:auto}
@media (max-width:640px){ .hbar{height:auto;padding:8px 0} main{padding:16px 14px 60px} }
@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff}main{max-width:none;padding:0}
  .card{box-shadow:none;border-color:#ccc;page-break-inside:avoid}
}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="logo"><span class="dot"></span><span class="dot2"></span>Grant&nbsp;Copilot</div>
    <div class="hspace"></div>
    <span id="syncState" class="sync" onclick="App.go('settings')" title="Cloud sync status"></span>
    <div class="orgpick">
      <select id="orgSel" onchange="App.switchOrg(this.value)" title="Active organization"></select>
      <button class="b g sm" onclick="App.newOrg()" title="Add organization">+ Org</button>
    </div>
  </div>
  <nav id="nav"></nav>
</header>

<main>
  <div class="view" id="v-dash"></div>
  <div class="view" id="v-vault"></div>
  <div class="view" id="v-docs"></div>
  <div class="view" id="v-answers"></div>
  <div class="view" id="v-rfp"></div>
  <div class="view" id="v-drafts"></div>
  <div class="view" id="v-track"></div>
  <div class="view" id="v-data"></div>
  <div class="view" id="v-search"></div>
  <div class="view" id="v-settings"></div>
</main>

<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)App.closeModal()"><div class="inner" id="modalInner"></div></div>

<script>
/* ============================================================
   GRANT COPILOT — self-contained grant data vault + draft engine
   Data lives in this browser (localStorage). Export regularly.
   ============================================================ */
"use strict";

const KEY = "grantCopilot.v1";
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* Local date, not UTC — an evening in Philadelphia is already tomorrow in UTC,
   which would shift every deadline count by a day. */
const today = () => { const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const words = s => (String(s||"").trim().match(/\S+/g)||[]).length;
const fmtD = d => { if(!d) return "—"; const p=String(d).split("-"); if(p.length<3) return d;
  return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); };
const daysTo = d => { if(!d) return null; const p=String(d).split("-"); if(p.length<3) return null;
  return Math.round((new Date(+p[0],+p[1]-1,+p[2]) - new Date(today().split("-")[0],+today().split("-")[1]-1,+today().split("-")[2]))/864e5); };
const money = n => (n===""||n==null||isNaN(+n))?"—":"$"+Number(n).toLocaleString("en-US",{maximumFractionDigits:0});
const nn = v => (v==null?"":String(v));

/* ---------- pipeline stages ---------- */
const STAGES = ["Prospect","Reading RFP","Drafting","Review","Submitted","Awarded","Declined","Reporting"];
const LEGACY_STAGE = {"Researching":"Prospect","Internal review":"Review"};
const CLOSED = new Set(["Submitted","Awarded","Declined","Reporting"]);
const isOpen = a => !CLOSED.has(a.status);
function stagePill(s){ return s==="Awarded"||s==="Reporting"?"ok":s==="Declined"?"bad":s==="Submitted"?"neu":"org"; }

/* ---------- blank organization ---------- */
function blankOrg(name){
  return {
    id: uid(), name: name || "New Organization",
    profile:{
      legalName:"", dba:"", ein:"", uei:"", samStatus:"", samExpires:"", duns:"",
      entityType:"501(c)(3) nonprofit", incState:"", incDate:"", determinationDate:"", ntee:"",
      licenseNos:"", addr:"", city:"", state:"", zip:"", county:"", phone:"", email:"", website:"",
      fiscalYearEnd:"", edName:"", edTitle:"Executive Director", edEmail:"", edPhone:"", edBio:"",
      mission:"", vision:"", history:"", serviceArea:"", populationServed:"", needStatement:"",
      programDesc:"", goalsOutcomes:"", evaluation:"", capacity:"", equity:"", sustainability:"",
      partnerships:"", facilities:"", accreditation:"",
      enrolled:"", capacityLicensed:"", staffCount:"", annualBudget:"", mealsPerYear:"",
      pctSubsidy:"", yearsOperating:"", auditStatus:"", revenueMix:"", fiscalSponsor:"",
      ageGroups:"", hours:"", stars:""
    },
    board:[], staff:[], programs:[], awards:[],
    docs:[], answers:[], apps:[]
  };
}

/* ---------- seed: a blank starter organization ----------
   No real organization data lives in the code. Fill the Org Vault in the app,
   or restore a backup in Backup → Import. */
function seedStarter(){
  const o = blankOrg("My Organization");
  o.docs = ["IRS 501(c)(3) determination letter|Legal/Tax|No expiration","W-9|Legal/Tax|Re-sign annually for most funders",
    "Board of Directors roster|Governance|","Articles of Incorporation / bylaws|Governance|","Certificate of liability insurance|Insurance|",
    "Most recent audit or financial review|Financial|","IRS Form 990 (most recent)|Financial|","Current year operating budget|Financial|",
    "SAM.gov registration confirmation|Federal|Renews annually"].map(x=>{ const [name,cat,notes]=x.split("|");
      return {id:uid(), name, cat, expires:"", loc:"", notes, status:"unknown"}; });
  return o;
}

/* ---------- state ---------- */
let S = null;
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ S = JSON.parse(raw);
    if(S && S.orgs && S.orgs.length){ S.orgs.forEach(normalizeOrg); normalizeState(); return; } } }catch(e){ console.warn("load failed",e); }
  const p = seedStarter();
  S = { orgs:[p], activeId:p.id, v:2 };
  normalizeState();
  save();
}
function normalizeOrg(o){
  const b = blankOrg();
  o.profile = Object.assign({}, b.profile, o.profile||{});
  ["board","staff","programs","awards","docs","answers","apps"].forEach(k=>{ if(!Array.isArray(o[k])) o[k]=[]; });
  o.apps.forEach(a=>{ if(LEGACY_STAGE[a.status]) a.status=LEGACY_STAGE[a.status]; if(!STAGES.includes(a.status)) a.status="Prospect";
    a.parsed=a.parsed||{questions:[],attachments:[],budget:[],scoring:[],eligibility:[],raw:""};
    a.drafts=a.drafts||{}; a.draftMeta=a.draftMeta||{}; a.attachOK=a.attachOK||{}; a.versions=a.versions||{}; a.budgetAck=a.budgetAck||{}; });
}
function normalizeState(){
  S.settings = Object.assign({ reminderDays:14, requireSignoff:false, savedSearches:[], seenOpps:{}, notified:{} }, S.settings||{});
}
const SAVE_HOOKS = [];
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Could not save — storage may be full","err"); }
  SAVE_HOOKS.forEach(f=>{ try{ f(); }catch(e){ console.warn(e); } }); }
function org(){ return S.orgs.find(o=>o.id===S.activeId) || S.orgs[0]; }

function toast(m, cls){ const t=document.getElementById("toast"); t.textContent=m; t.className="toast on"+(cls?" "+cls:"");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.className="toast",2600); }

/* ---------- field metadata for the vault + draft engine ---------- */
const FIELD_LABEL = {
  legalName:"Legal name", dba:"DBA / trade name", ein:"EIN", uei:"UEI (SAM.gov)", samStatus:"SAM.gov status",
  samExpires:"SAM registration expires", duns:"DUNS", entityType:"Entity type", incState:"State of incorporation",
  incDate:"Date incorporated", determinationDate:"IRS determination date", ntee:"NTEE code",
  licenseNos:"License / certificate numbers", addr:"Street address", city:"City", state:"State", zip:"ZIP",
  county:"County", phone:"Phone", email:"Organization email", website:"Website", fiscalYearEnd:"Fiscal year end",
  edName:"Executive Director name", edTitle:"ED title", edEmail:"ED email", edPhone:"ED phone", edBio:"ED biography",
  mission:"Mission statement", vision:"Vision statement", history:"Organizational history",
  serviceArea:"Service area", populationServed:"Population served", needStatement:"Statement of need",
  programDesc:"Program description", goalsOutcomes:"Goals and measurable outcomes", evaluation:"Evaluation plan",
  capacity:"Organizational capacity", equity:"Equity / DEI approach", sustainability:"Sustainability plan",
  partnerships:"Partnerships and collaborations", facilities:"Facilities description", accreditation:"Accreditation",
  enrolled:"Children currently enrolled", capacityLicensed:"Licensed capacity", staffCount:"Number of staff",
  annualBudget:"Annual operating budget", mealsPerYear:"Meals served per year", pctSubsidy:"% subsidy / low-income",
  yearsOperating:"Years operating", auditStatus:"Audit status", revenueMix:"Revenue sources and percentages",
  fiscalSponsor:"Fiscal sponsor", ageGroups:"Age groups served", hours:"Hours of operation", stars:"Keystone STARS level"
};
const VAULT_SECTIONS = [
  { k:"ident", t:"Identity & registrations", d:"The numbers every application asks for. Fill these once.",
    f:["legalName","dba","entityType","ein","uei","samStatus","samExpires","duns","incState","incDate","determinationDate","ntee","licenseNos","stars","accreditation"] },
  { k:"contact", t:"Contact & location", d:"",
    f:["addr","city","state","zip","county","phone","email","website","fiscalYearEnd","hours"] },
  { k:"leader", t:"Leadership", d:"",
    f:["edName","edTitle","edEmail","edPhone","edBio"] },
  { k:"narr", t:"Narrative library", d:"Reusable prose. The draft engine pulls from these fields first.",
    f:["mission","vision","history","serviceArea","populationServed","ageGroups","needStatement","programDesc","goalsOutcomes","evaluation","capacity","equity","sustainability","partnerships","facilities"] },

/* Keywords of 5 characters or fewer must match whole words, so "ein" does not
   fire on "being". The first keyword of each topic is its canonical term and
   carries 2.5x weight. A topic only wins with a real lead; otherwise the match
   is reported as weak so the draft gets flagged for review. */
function kwHit(t,k){
  if(k.length<=5) return new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i").test(t);
  return t.includes(k);
}
function classify(text){
  const t = String(text||"").toLowerCase();
  const scored = TOPICS.map(tp=>{
    let sc=0;
    tp.kw.forEach((k,i)=>{ if(kwHit(t,k)) sc += Math.min(k.length,22) * (i===0?2.5:1); });
    return {tp, sc};
  }).sort((a,b)=>b.sc-a.sc);
  const best=scored[0], second=scored[1]||{sc:0};
  if(!best || best.sc < 6) return {topic:null, score:best?Math.round(best.sc):0, conf:"none"};
  const high = best.sc>=12 || (second.sc>0 && best.sc>=second.sc*2 && best.sc>=9);
  return {topic:best.tp, score:Math.round(best.sc), conf: high?"high":"low"};
}

/* ---------- draft builder ---------- */
function buildDraft(q, o){
  const used=[], gaps=[];
  const F = key => {
    const v = o.profile[key];
    if(v!=null && String(v).trim()!==""){ used.push(key); return String(v).trim(); }
    const lab = FIELD_LABEL[key]||key;
    if(!gaps.includes(lab)) gaps.push(lab);
    return gapTok(lab);
  };
  // 1. prefer a reusable answer from the library
  const lib = matchAnswers(q.text, o);
  if(lib.length && lib[0].score >= 3){
    return { text: lib[0].a.text, gaps:[], used:[], source:"Answer library — "+(lib[0].a.title||"untitled")+(lib[0].a.won?" (funded)":""), alts:lib.slice(1,4) };
  }
  // 2. build from vault
  const cls = classify(q.text);
  if(!cls.topic){
    return { text: gapTok("No vault field matches this question — write it here, then save it to the Answer Library for reuse"),
      gaps:["Unmatched question"], used:[], source:"No match", alts:lib.slice(0,3) };
  }
  let parts = cls.topic.build(F, o).filter(x=>x && String(x).trim()!=="");
  let text = parts.join("\n\n")
    .replace(/[ \t]+\n/g,"\n")
    .replace(/([.!?])\s*\.(?!\.)/g,"$1")   // vault field already ended in a period
    .replace(/\s+([.,;:])/g,"$1")
    .trim();
  // trim toward a word limit without cutting mid-sentence
  if(q.limit && q.limitType==="words" && words(text) > q.limit){
    const sents = text.split(/(?<=[.!?])\s+/); let out=[];
    for(const s of sents){ if(words(out.join(" ")+" "+s) > q.limit) break; out.push(s); }
    if(out.length) text = out.join(" ") + "\n\n"+gapTok("Trimmed to fit the "+q.limit+"-word limit — review what was cut");
  }
  return { text, gaps, used, source:"Vault — "+cls.topic.label, alts:lib.slice(0,3) };
}

function matchAnswers(qtext, o){
  const t = String(qtext||"").toLowerCase();
  const toks = (t.match(/[a-z]{4,}/g)||[]).filter(w=>!["that","this","your","will","with","have","from","what","describe","please","provide","include","about","which","their","there","would","should","other","organization"].includes(w));
  const res=[];
  for(const a of o.answers){
    const hay = ((a.question||"")+" "+(a.title||"")+" "+(a.tags||"")).toLowerCase();
    let sc=0; const seen=new Set();
    for(const w of toks){ if(!seen.has(w) && hay.includes(w)){ sc++; seen.add(w); } }
    if(a.won) sc += 1.5;
    if(sc>0) res.push({a, score:sc});
  }
  return res.sort((x,y)=>y.score-x.score);
}

   RFP PARSER
   ============================================================ */
const MONTHS="january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|sept|oct|nov|dec";
const DATE_RX = new RegExp(
  "(?:("+MONTHS+")\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s+(\\d{4}))"+
  "|(?:(\\d{1,2})\\s+("+MONTHS+")\\.?,?\\s+(\\d{4}))"+
  "|(\\d{1,2})[\\/\\-](\\d{1,2})[\\/\\-](\\d{2,4})"+
  "|(\\d{4})-(\\d{2})-(\\d{2})","gi");
const MON_N = {january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};

function toISO(m){
  let y,mo,d;
  if(m[1]){ mo=MON_N[m[1].toLowerCase()]; d=+m[2]; y=+m[3]; }
  else if(m[5]){ mo=MON_N[m[5].toLowerCase()]; d=+m[4]; y=+m[6]; }
  else if(m[7]){ mo=+m[7]; d=+m[8]; y=+m[9]; if(y<100) y+=2000; }
  else if(m[10]){ y=+m[10]; mo=+m[11]; d=+m[12]; }
  if(!y||!mo||!d||mo>12||d>31) return null;
  return y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}

const DEADLINE_KW = ["deadline","due date","due by","applications due","submit by","submission deadline","must be received","no later than","closes","closing date","postmarked by","due on","proposals due","letters of inquiry due"];
const DOC_NAMES = [

  ["Current operating budget",/(?:current|annual|organizational|agency)\s+(?:operating\s+)?budget/i],

  ["Staff résumés / job descriptions",/r[eé]sum[eé]|curriculum vitae|\bcv\b|job description|position description|staff qualifications? (?:document|attach)/i],
  ["Organizational chart",/organization(?:al)? chart|org chart/i],
  ["SAM.gov / UEI registration",/sam\.gov|unique entity id|\buei\b|system for award management/i],
  ["Logic model / work plan",/logic model|work ?plan|timeline (?:attachment|chart)|gantt/i],
  ["Evaluation plan",/evaluation plan|measurement plan/i],
  ["Tax clearance / good standing",/tax clearance|certificate of good standing|good standing/i],
  ["Indirect cost rate agreement",/indirect cost rate|nicra|negotiated rate/i],
  ["Signed assurances / certifications",/assurances|certifications? (?:form|page)|signature page|lobbying certification|debarment/i]
];
const ATTACH_VERB = /\b(attach|upload|enclose|submit|include|provide|append|accompanied by|must contain|required document)/i;
const BUDGET_RX = [
  ["Indirect cost / administrative cap", /indirect (?:cost|rate)s?|administrative (?:cost|cap|rate)|de minimis|overhead/i],
  ["Match / cost share requirement", /\bmatch(?:ing)?\b|cost[- ]shar|in[- ]kind|leverag(?:e|ed) funds|non[- ]federal share/i],
  ["Unallowable costs", /unallowable|not allowable|may not be used|ineligible (?:cost|expense)|cannot be used (?:for|to)|prohibit/i],
  ["Supplanting restriction", /supplant/i],
  ["Equipment / capital limits", /capital (?:expense|improvement|cost)|equipment (?:over|exceeding|purchase)|construction cost/i],
  ["Reporting requirement", /(?:financial|progress|interim|final) report|reporting requirement|report(?:s)? (?:are|is) due|quarterly report/i],
  ["Payment / reimbursement terms", /reimburse|advance payment|drawdown|invoice/i]
];
const AMOUNT_RX = /\$\s?([\d,]{3,}(?:\.\d{2})?)(?:\s*(?:-|–|to)\s*\$?\s?([\d,]{3,}))?/g;

function parseRFP(raw){
  const text = String(raw||"").replace(/\r/g,"");
  const lines = text.split("\n").map(l=>l.replace(/\s+/g," ").trim());
  const out = { deadline:"", deadlineLine:"", funder:"", amountMin:"", amountMax:"", questions:[],
    attachments:[], budget:[], scoring:[], eligibility:[], raw:text };

  /* --- deadline --- */
  let bestD=null;
  lines.forEach(l=>{
    const low=l.toLowerCase();
    if(!DEADLINE_KW.some(k=>low.includes(k))) return;
    DATE_RX.lastIndex=0; let m;
    while((m=DATE_RX.exec(l))){
      const iso=toISO(m); if(!iso) continue;
      const dt=daysTo(iso);
      if(dt!=null && dt>=-45 && (!bestD || dt<bestD.dt)){ bestD={iso,dt,line:l}; }
    }
  });
  if(!bestD){ // fall back: any future date in the document
    DATE_RX.lastIndex=0; let m;
    while((m=DATE_RX.exec(text))){
      const iso=toISO(m); if(!iso) continue; const dt=daysTo(iso);
      if(dt!=null && dt>=0 && (!bestD || dt<bestD.dt)) bestD={iso,dt,line:"(date found in document, not labelled as a deadline)"};
    }
  }
  if(bestD){ out.deadline=bestD.iso; out.deadlineLine=bestD.line; }

  /* --- award amounts --- */
  const amts=[]; AMOUNT_RX.lastIndex=0; let am;
  while((am=AMOUNT_RX.exec(text))){
    const a=+am[1].replace(/,/g,""); if(a>=500) amts.push(a);
    if(am[2]){ const b=+am[2].replace(/,/g,""); if(b>=500) amts.push(b); }
  }
  if(amts.length){ out.amountMin=Math.min(...amts); out.amountMax=Math.max(...amts); }

  /* --- funder guess: first title-ish line --- */
  for(const l of lines){
    if(l.length>6 && l.length<90 && /foundation|trust|department|office of|fund\b|united way|commission|bureau|initiative|institute|corporation|agency|council/i.test(l)){ out.funder=l; break; }
  }

  /* --- questions --- */
  const VERB = /^(describe|explain|provide|list|identify|summar|discuss|outline|detail|state|tell us|share|address|demonstrate|indicate|specify|define|document|include a (?:brief )?(?:description|narrative|statement)|what|why|how|who|where|which|in what)/i;
  const NUMBERED = /^(?:(?:\d{1,2}|[a-z]|[ivx]{1,4})[\.\)]\s+|q\s*\d{1,2}[\.\):]?\s+|#\d{1,2}\s+|[-–•*]\s+)/i;
  const SKIP = /^(?:page\s*\d|section\s+[ivx\d]|table of contents|appendix|see (?:page|section)|deadline|due date|contact|phone|email|fax|http|www\.)/i;
  const SCORE_LINE = /\(\s*\d{1,3}\s*(?:points?|pts?|%)\s*\)\s*\.?$|[—–-]\s*\d{1,3}\s*(?:points?|pts?)\s*\.?$|\b\d{1,3}\s*points?\s*$/i;
  const LIMIT_TAIL = /\s*[\(\[][^()\[\]]{0,40}?\d{2,5}\s*(?:word|character)s?[^()\[\]]{0,20}?[\)\]]\s*\.?$/i;
  const seenQ = new Set();

  for(let i=0;i<lines.length;i++){
    let l = lines[i];
    if(!l || l.length<18 || l.length>700) continue;
    if(SKIP.test(l) || SCORE_LINE.test(l)) continue;
    let stripped = l.replace(NUMBERED,"").trim();
    const isQ = /\?\s*$/.test(l) || VERB.test(stripped) || (NUMBERED.test(l) && VERB.test(stripped));
    if(!isQ) continue;
    if(/^\s*(?:describe|list|provide)?\s*$/i.test(stripped)) continue;
    const key = stripped.toLowerCase().slice(0,70);
    if(seenQ.has(key)) continue; seenQ.add(key);

    // look for a word/character limit in this line and the next two
    let limit="", limitType="";
    const probe = [l, lines[i+1]||"", lines[i+2]||""].join(" ");
    const lm = probe.match(/(?:(?:maximum|max|no more than|not (?:to )?exceed|limit(?:ed)? (?:to|of)?|up to|within|about)\s*:?\s*)?(\d{2,5})[\s-]*(word|character)s?\b/i)
            || probe.match(/\((\d{2,5})\s*(word|character)s?(?:\s*(?:max|maximum|limit|or less))?\)/i);
    if(lm){ limit=+lm[1]; limitType=lm[2].toLowerCase()==="word"?"words":"chars"; }
    stripped = stripped.replace(LIMIT_TAIL,"").trim();
    if(stripped.length<12) continue;

    const cls = classify(stripped);
    out.questions.push({ id:uid(), text:stripped, limit, limitType,
      topicId: cls.topic?cls.topic.id:"", topicLabel: cls.topic?cls.topic.label:"", conf: cls.conf });
  }

  /* --- required attachments ---
     Only count a document when it appears somewhere that actually asks for it:
     a line with an attach/submit verb, a line saying "required", or a line inside
     an attachment checklist block. Scoring lines are excluded. Each source line is
     claimed once, so "audited financial statements" does not also register as the
     generic "financial statements". */
  const ZONE_START = /required (?:documents|attachments|materials|forms)|^attachments?\s*:?\s*$|documents to (?:submit|attach|include)|supporting (?:documents|materials)|application (?:checklist|materials)|(?:must|should) (?:attach|submit|include|provide) the following|the following (?:documents|items|materials|attachments)/i;
  const ZONE_END = /^(?:budget instructions|review criteria|scoring|evaluation criteria|eligibility|application questions|questions|deadline|submission instructions|contact)/i;
  const zone=new Set();
  lines.forEach((l,i)=>{
    if(!ZONE_START.test(l)) return;
    for(let j=i;j<Math.min(lines.length,i+30);j++){ if(j>i && ZONE_END.test(lines[j])) break; zone.add(j); }
  });
  const claimed=new Set(), found=[];
  for(const [name,rx] of DOC_NAMES){
    let ctx="", required=false, idx=-1;
    for(let i=0;i<lines.length;i++){
      const l=lines[i];
      if(!l || claimed.has(i) || SCORE_LINE.test(l) || !rx.test(l)) continue;
      const asked = ATTACH_VERB.test(l) || /\brequired\b/i.test(l) || zone.has(i);
      if(!asked) continue;
      ctx=l; idx=i; required = /\brequired\b/i.test(l) || /\bmust\b/i.test(l) || zone.has(i);
      break;
    }
    if(idx>=0){ claimed.add(idx); found.push({name, ctx, required}); }
  }
  out.attachments = found;

  /* --- budget rules --- */
  for(const [name,rx] of BUDGET_RX){
    const hits = lines.filter(l=>rx.test(l) && l.length>12).slice(0,2);
    if(hits.length) out.budget.push({name, lines:hits});
  }

  /* --- scoring criteria --- */
  lines.forEach(l=>{
    const m = l.match(/^(.{3,80}?)[\s\.\-–:]*\(?\s*(\d{1,3})\s*(?:points?|pts?|%)\s*\)?\s*$/i);
    if(m && +m[2]<=100 && +m[2]>0 && !/^\d+$/.test(m[1].trim())) out.scoring.push({crit:m[1].replace(/[\.\-–:\s]+$/,"").trim(), pts:+m[2]});
    else {
      const m2 = l.match(/^(.{3,80}?)\s*[—–-]\s*(\d{1,3})\s*(?:points?|pts?)\b/i);
      if(m2 && +m2[2]<=100) out.scoring.push({crit:m2[1].trim(), pts:+m2[2]});
    }
  });
  if(out.scoring.length>14) out.scoring=out.scoring.slice(0,14);

  /* --- eligibility --- */
  lines.forEach((l,i)=>{ if(/eligib/i.test(l) && l.length>25 && out.eligibility.length<6) out.eligibility.push(l); });

  return out;
}

function vaultStats(o){
  let total=0, filled=0;
  VAULT_SECTIONS.forEach(s=>s.f.forEach(k=>{ total++; if(String(o.profile[k]||"").trim()) filled++; }));
  return {total, filled, pct: total?Math.round(filled/total*100):0};
}
function docStats(o){
  const exp=[], soon=[], missing=[];
  o.docs.forEach(d=>{
    if(d.status==="missing"||d.status==="unknown") missing.push(d);
    const dt=daysTo(d.expires);
    if(dt!=null){ if(dt<0) exp.push(d); else if(dt<=60) soon.push(d); }
  });
  return {exp, soon, missing};
}

function fuzzyDoc(a,b){
  const n=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  const A=n(a),B=n(b); if(A===B) return true;
  if(A.includes(B)||B.includes(A)) return true;
  const stem=w=>w.replace(/(?:ing|ed|es|s)$/,"");
  const ta=new Set(A.split(" ").filter(w=>w.length>3).map(stem));
  const tb=B.split(" ").filter(w=>w.length>3).map(stem);
  if(!tb.length) return false;
  const hits=tb.filter(w=>ta.has(w)).length;
  return hits/tb.length >= 0.6;
}

/* A draft that is nothing but gap markers is not an answer. */
function appProgress(a){
  const qs=(a&&a.parsed&&a.parsed.questions)||[];
  const rx=new RegExp(GAP_A,"g");
  let drafted=0, complete=0, gaps=0;
  qs.forEach(q=>{ const d=String((a.drafts||{})[q.id]||"");
    if(!d.trim()) return; drafted++;
    const g=(d.match(rx)||[]).length; gaps+=g; if(!g) complete++; });
  return {total:qs.length, drafted, complete, gaps};
}
function pushVersion(a,qid,src){
  const prev=String((a.drafts||{})[qid]||""); if(!prev.trim()) return;
  a.versions=a.versions||{}; const L=a.versions[qid]=a.versions[qid]||[];
  if(L.length && L[0].text===prev) return;
  L.unshift({t:new Date().toISOString(), text:prev, src:src||((a.draftMeta||{})[qid]||{}).source||"edit", by:(window.Cloud&&Cloud.email())||""});
  if(L.length>20) L.length=20;
}
function setDraft(aid,qid,v){ const a=org().apps.find(x=>x.id===aid); if(!a)return; a.drafts=a.drafts||{};
  if(v!==a.drafts[qid]) pushVersion(a,qid,"before manual edit"); a.drafts[qid]=v; save(); }
function setQ(aid,qid,k,v){ const a=org().apps.find(x=>x.id===aid); const q=a&&a.parsed.questions.find(x=>x.id===qid);
  if(q){ q[k]=v; if(k==="text"){ const c=classify(v); q.topicId=c.topic?c.topic.id:""; q.topicLabel=c.topic?c.topic.label:""; q.conf=c.conf; } save(); } }
function addQ(aid){ const a=org().apps.find(x=>x.id===aid); if(!a)return;
  a.parsed=a.parsed||{questions:[]}; a.parsed.questions=a.parsed.questions||[];
  a.parsed.questions.push({id:uid(),text:"New question",limit:"",limitType:"",topicId:"",topicLabel:""}); save(); render(); }
function delQ(aid,qid){ const a=org().apps.find(x=>x.id===aid); if(!a)return;
  a.parsed.questions=a.parsed.questions.filter(q=>q.id!==qid); if(a.drafts) delete a.drafts[qid]; save(); render(); }
function setAttach(aid,name,v){ const a=org().apps.find(x=>x.id===aid); if(!a)return; a.attachOK=a.attachOK||{}; a.attachOK[name]=v; save(); }

function saveToLib(aid,qid){
  const o=org(), a=o.apps.find(x=>x.id===aid); const q=a.parsed.questions.find(x=>x.id===qid);
  const t=(a.drafts||{})[qid]||"";
  if(new RegExp(GAP_A).test(t) && !confirm("This draft still has unfilled gap markers. Save it to the library anyway?")) return;
  addAnswer({title:(q.topicLabel||q.text.slice(0,50)), question:q.text, text:t, funder:a.funder||"", tags:q.topicId||""});
  cur="answers"; render(); toast("Saved to Answer Library");
}
function dl(name,text,mime){
  const b=new Blob([text],{type:mime||"text/plain"}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(u),3000);
}

    <div class="f"><label>Restore from a backup file</label><input type="file" accept=".json,application/json" onchange="importAll(this)"></div>
    <div class="hint">This replaces everything currently stored. Export first if you are unsure.</div>
  </div>

  <div class="card"><h3>Organizations</h3>
    ${S.orgs.map(x=>`<div class="inline" style="padding:7px 0;border-bottom:1px solid var(--line)">
      <div style="flex:1">${esc(x.name)} ${x.id===S.activeId?'<span class="pill ok">active</span>':""}
        <br><small>${x.apps.length} applications · ${x.answers.length} answers · ${vaultStats(x).pct}% vault</small></div>
      ${S.orgs.length>1?`<button class="lk dz" onclick="delOrg('${x.id}')">delete</button>`:""}
    </div>`).join("")}
    <div class="btnrow" style="margin-top:12px"><button class="b g sm" onclick="App.newOrg()">+ Add organization</button>
      <button class="b g sm" onclick="cloneOrg()">Duplicate active organization</button></div>
  </div>

  <div class="card"><h3>Reset</h3>
    <div class="btnrow"><button class="b dz" onclick="wipe()">Erase all data in this browser</button></div>
  </div>

  <div class="card"><h3>How the draft engine decides</h3>
    <div class="note"><strong>With AI on</strong>, Claude reads the question, the RFP's scoring criteria, your vault, and your closest Answer Library matches, then writes a tailored answer within the limit and lists the sources it used. It is told to mark missing facts as gaps rather than invent them. <strong>With AI off or unavailable</strong>, the offline engine below runs instead.</div>
    <ol style="font-size:.9rem;line-height:1.7;padding-left:20px;margin:0">
      <li>It reads the funder's question and looks for a strong match in your <strong>Answer Library</strong>. Funded answers win ties.</li>
      <li>If no saved answer matches, it classifies the question against ${TOPICS.length} vault topics (mission, need, capacity, budget, and so on).</li>
      <li>It assembles the draft from the vault fields that topic uses, in order.</li>
      <li>Any field that is empty becomes a <span class="gap">NEEDS: …</span> marker. It does not estimate, round, or infer a number you have not entered.</li>
      <li>If the question has a word limit and the draft runs long, it trims at a sentence boundary and tells you it did.</li>
    </ol>
    <div class="note d" style="margin-top:12px"><strong>You are the submitter.</strong> This tool drafts and assembles; it does not submit. Grant applications carry certifications you sign personally — read every answer, verify every number against your own records, and resolve every gap marker before you file.</div>
  </div>`;
}
function exportAll(){ dl("grant-copilot-backup-"+today()+".json", JSON.stringify(S,null,2), "application/json"); toast("Backup downloaded"); }
function importAll(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.orgs)||!d.orgs.length) throw new Error("not a Grant Copilot backup");
      if(!confirm("Replace all current data with this backup?")) return;
      S=d; S.orgs.forEach(normalizeOrg); normalizeState(); if(!S.orgs.some(o=>o.id===S.activeId)) S.activeId=S.orgs[0].id;
      save(); cur="dash"; render(); toast("Backup restored");
    }catch(e){ toast("Could not read that file: "+e.message,"err"); } };
  r.readAsText(f); inp.value="";
}
function exportVaultMD(){
  const o=org(), L=["# "+(o.profile.legalName||o.name)+" — Grant Data Vault","","_Exported "+fmtD(today())+"_",""];
  VAULT_SECTIONS.forEach(s=>{
    L.push("## "+s.t,"");
    s.f.forEach(k=>{ const v=nn(o.profile[k]).trim(); L.push("**"+(FIELD_LABEL[k]||k)+":** "+(v||"_(not filled)_")); L.push(""); });
  });
  if(o.board.length){ L.push("## Board of Directors",""); o.board.forEach(b=>L.push("- "+b.name+(b.role?", "+b.role:"")+(b.affil?" — "+b.affil:""))); L.push(""); }
  if(o.staff.length){ L.push("## Key staff",""); o.staff.forEach(s=>L.push("- **"+s.name+"**"+(s.title?", "+s.title:"")+(s.cred?" ("+s.cred+")":"")+(s.bio?" — "+s.bio:""))); L.push(""); }
  if(o.programs.length){ L.push("## Programs",""); o.programs.forEach(p=>L.push("- **"+p.name+"**"+(p.ages?" ("+p.ages+")":"")+(p.desc?" — "+p.desc:""))); L.push(""); }
  if(o.awards.length){ L.push("## Grant history",""); o.awards.forEach(a=>L.push("- "+(a.funder||"—")+" — "+money(a.amount)+(a.year?" ("+a.year+")":"")+(a.purpose?" — "+a.purpose:""))); L.push(""); }
  if(o.docs.length){ L.push("## Document library",""); o.docs.forEach(d=>L.push("- "+d.name+" — "+d.status+(d.expires?", expires "+fmtD(d.expires):"")+(d.loc?", at "+d.loc:""))); }
  dl("grant-vault-"+today()+".md", L.join("\n"), "text/markdown"); toast("Vault exported");
}
function exportAnswersMD(){
  const o=org(); if(!o.answers.length){ toast("No saved answers yet","err"); return; }
  const L=["# Answer Library — "+(o.profile.legalName||o.name),""];
  o.answers.forEach(a=>{ L.push("## "+(a.title||"Untitled")+(a.won?" (funded)":""),"");
    if(a.question) L.push("**Question:** "+a.question,"");
    L.push(a.text||"","", "_"+words(a.text)+" words"+(a.funder?" · "+a.funder:"")+(a.year?" · "+a.year:"")+"_","","---",""); });
  dl("answer-library-"+today()+".md", L.join("\n"), "text/markdown"); toast("Answer library exported");
}
function delOrg(id){
  if(S.orgs.length<2) return;
  const o=S.orgs.find(x=>x.id===id);
  if(!confirm("Delete "+(o?o.name:"this organization")+" and everything in it? This cannot be undone.")) return;
  S.orgs=S.orgs.filter(x=>x.id!==id); if(S.activeId===id) S.activeId=S.orgs[0].id; save(); render(); toast("Organization deleted");
}
function cloneOrg(){
  const o=org(), c=JSON.parse(JSON.stringify(o));
  c.id=uid(); c.name=o.name+" (copy)";
  ["board","staff","programs","awards","docs","answers","apps"].forEach(k=>c[k].forEach(r=>r.id=uid()));
  S.orgs.push(c); S.activeId=c.id; save(); render(); toast("Duplicated");
}
function wipe(){
  if(!confirm("Erase every organization, vault, document, answer, and application stored in this browser?")) return;
  if(!confirm("Last check — this cannot be undone. Have you exported a backup?")) return;
  localStorage.removeItem(KEY); S=null; load(); cur="dash"; render(); toast("All data erased");
}
